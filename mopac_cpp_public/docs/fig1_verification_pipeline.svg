<svg xmlns="http://www.w3.org/2000/svg" width="920" height="340" viewBox="0 0 920 340" font-family="Arial, Helvetica, sans-serif">
  <title>Bitwise verification pipeline (Fig. 1)</title>
  <rect width="920" height="340" fill="#ffffff"/>
  <!-- pipeline nodes -->
  <g font-size="13" text-anchor="middle">
    <g>
      <rect x="10"  y="40" width="95" height="46" rx="6" fill="#eef4fb" stroke="#2c5fa8" stroke-width="1.5"/>
      <text x="57" y="59" fill="#1a1a1a">xparam</text>
      <text x="57" y="75" fill="#555">(coords)</text>
    </g>
    <g>
      <rect x="125" y="40" width="95" height="46" rx="6" fill="#eef4fb" stroke="#2c5fa8" stroke-width="1.5"/>
      <text x="172" y="59" fill="#1a1a1a">SCF</text>
      <text x="172" y="75" fill="#555">(Fock/den)</text>
    </g>
    <g>
      <rect x="240" y="40" width="95" height="46" rx="6" fill="#eef4fb" stroke="#2c5fa8" stroke-width="1.5"/>
      <text x="287" y="59" fill="#1a1a1a">grad</text>
      <text x="287" y="75" fill="#555">(deriv)</text>
    </g>
    <g>
      <rect x="355" y="40" width="95" height="46" rx="6" fill="#eef4fb" stroke="#2c5fa8" stroke-width="1.5"/>
      <text x="402" y="59" fill="#1a1a1a">hessc</text>
      <text x="402" y="75" fill="#555">(Hessian)</text>
    </g>
    <g>
      <rect x="470" y="40" width="95" height="46" rx="6" fill="#fdf3e7" stroke="#b07020" stroke-width="1.5"/>
      <text x="517" y="59" fill="#1a1a1a">rsp</text>
      <text x="517" y="75" fill="#555">(dsyevd)</text>
    </g>
    <g>
      <rect x="585" y="40" width="95" height="46" rx="6" fill="#fdf3e7" stroke="#b07020" stroke-width="1.5"/>
      <text x="632" y="59" fill="#1a1a1a">prjfc</text>
      <text x="632" y="75" fill="#555">(project)</text>
    </g>
    <g>
      <rect x="700" y="40" width="95" height="46" rx="6" fill="#eef4fb" stroke="#2c5fa8" stroke-width="1.5"/>
      <text x="747" y="59" fill="#1a1a1a">fx</text>
      <text x="747" y="75" fill="#555">(Uᵀ·g)</text>
    </g>
    <g>
      <rect x="815" y="40" width="95" height="46" rx="6" fill="#eef4fb" stroke="#2c5fa8" stroke-width="1.5"/>
      <text x="862" y="59" fill="#1a1a1a">formd</text>
      <text x="862" y="75" fill="#555">(step)</text>
    </g>
  </g>
  <!-- arrows between nodes -->
  <g stroke="#2c5fa8" stroke-width="1.6" marker-end="url(#arw)">
    <defs><marker id="arw" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#2c5fa8"/></marker></defs>
    <line x1="105" y1="63" x2="122" y2="63"/>
    <line x1="220" y1="63" x2="237" y2="63"/>
    <line x1="335" y1="63" x2="352" y2="63"/>
    <line x1="450" y1="63" x2="467" y2="63"/>
    <line x1="565" y1="63" x2="582" y2="63"/>
    <line x1="680" y1="63" x2="697" y2="63"/>
    <line x1="795" y1="63" x2="812" y2="63"/>
  </g>
  <!-- layer labels -->
  <g font-size="12.5" text-anchor="middle">
    <rect x="10" y="130" width="440" height="34" rx="6" fill="#e8f4e8" stroke="#2e7d32" stroke-width="1.4"/>
    <text x="230" y="151" fill="#1a1a1a">L0 — bitwise: max|diff| = 0 at every layer (probe dumps, env-gated)</text>
    <rect x="470" y="130" width="440" height="34" rx="6" fill="#fff8e1" stroke="#b07020" stroke-width="1.4"/>
    <text x="690" y="151" fill="#1a1a1a">L1 — ≤ 1 ULP: localize layer, quantify max|diff| in ULPs</text>
    <rect x="10" y="174" width="900" height="34" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/>
    <text x="460" y="195" fill="#1a1a1a">L2 — bitwise-identical inputs, same routine, ≤1 ULP residual: library-instance difference (replay against official dump) — not a translation error</text>
  </g>
  <!-- ULP attribution loop -->
  <g font-size="13" text-anchor="middle">
    <rect x="10" y="240" width="900" height="44" rx="6" fill="#f5f5f5" stroke="#666" stroke-width="1.2"/>
    <text x="460" y="260" fill="#1a1a1a">ULP-attribution protocol: (1) dump &amp; compare inputs bitwise → (2) quantify output max|diff| → (3) replay same routine on identical inputs</text>
    <text x="460" y="276" fill="#444">adjudicated: C12H26 Hessian — 6553/6555 entries bitwise, MAXDIFF = 4.16e-17 → 2×1-ULP traced to instance-level MKL dgemm inside the reference binary</text>
  </g>
  <g font-size="11.5" fill="#666">
    <text x="10" y="325">Fig. 1 — Layered bitwise verification pipeline. Every layer is aligned bitwise before the next is entered; residual differences are localized and adjudicated by the ULP-attribution protocol.</text>
  </g>
</svg>
